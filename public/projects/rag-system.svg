<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Multi-Tenant Namespaced RAG System">
  <defs>
    <linearGradient id="ragBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101026"/>
      <stop offset="1" stop-color="#1a0f33"/>
    </linearGradient>
    <linearGradient id="ragAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39E1EC"/>
      <stop offset="0.55" stop-color="#7D5BFF"/>
      <stop offset="1" stop-color="#C86DD7"/>
    </linearGradient>
    <radialGradient id="ragGlow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#7D5BFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7D5BFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="400" fill="url(#ragBg)"/>
  <circle cx="320" cy="170" r="200" fill="url(#ragGlow)"/>

  <!-- central query node -->
  <circle cx="320" cy="200" r="30" fill="url(#ragAccent)"/>
  <!-- tenant namespace clusters -->
  <g stroke="url(#ragAccent)" stroke-width="2" opacity="0.8">
    <line x1="320" y1="200" x2="150" y2="110"/>
    <line x1="320" y1="200" x2="150" y2="290"/>
    <line x1="320" y1="200" x2="500" y2="110"/>
    <line x1="320" y1="200" x2="500" y2="290"/>
  </g>
  <g fill="#15151f" stroke="url(#ragAccent)" stroke-width="2.5">
    <circle cx="150" cy="110" r="20"/>
    <circle cx="150" cy="290" r="20"/>
    <circle cx="500" cy="110" r="20"/>
    <circle cx="500" cy="290" r="20"/>
  </g>
  <!-- child chunk dots -->
  <g fill="#39E1EC" opacity="0.9">
    <circle cx="110" cy="80" r="5"/><circle cx="90" cy="120" r="5"/><circle cx="120" cy="145" r="5"/>
    <circle cx="110" cy="320" r="5"/><circle cx="90" cy="280" r="5"/><circle cx="125" cy="255" r="5"/>
    <circle cx="540" cy="80" r="5"/><circle cx="555" cy="120" r="5"/><circle cx="525" cy="145" r="5"/>
    <circle cx="540" cy="320" r="5"/><circle cx="555" cy="280" r="5"/><circle cx="520" cy="255" r="5"/>
  </g>

  <text x="40" y="360" fill="#f4f4f8" font-family="Inter, sans-serif" font-size="26" font-weight="700">RAG System</text>
  <text x="40" y="384" fill="#a8a8b8" font-family="Inter, sans-serif" font-size="14">Hybrid search · RRF · namespaced retrieval</text>
</svg>
