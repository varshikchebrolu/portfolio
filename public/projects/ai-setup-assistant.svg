<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="AI Setup Assistant">
  <defs>
    <linearGradient id="asBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141a38"/>
      <stop offset="1" stop-color="#101633"/>
    </linearGradient>
    <linearGradient id="asAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5B8DEF"/>
      <stop offset="0.55" stop-color="#7D78F5"/>
      <stop offset="1" stop-color="#9B6DFF"/>
    </linearGradient>
    <radialGradient id="asGlow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#9B6DFF" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#9B6DFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="400" fill="url(#asBg)"/>
  <circle cx="320" cy="170" r="210" fill="url(#asGlow)"/>

  <!-- terminal window -->
  <rect x="150" y="70" width="340" height="200" rx="16" fill="#0b0f1e" stroke="url(#asAccent)" stroke-width="2.5"/>
  <circle cx="176" cy="94" r="6" fill="#ff5f57"/>
  <circle cx="196" cy="94" r="6" fill="#febc2e"/>
  <circle cx="216" cy="94" r="6" fill="#28c840"/>
  <g font-family="monospace" font-size="15" fill="#5B8DEF">
    <text x="172" y="140">$ setup --auto</text>
  </g>
  <g font-family="monospace" font-size="14" fill="#8a93b0">
    <text x="172" y="168">parsing onboarding docs...</text>
    <text x="172" y="192">executing scripts...</text>
  </g>
  <text x="172" y="222" font-family="monospace" font-size="14" fill="#9B6DFF">✓ ready in ~30% less time</text>
  <rect x="172" y="238" width="10" height="16" fill="#5B8DEF"/>

  <text x="40" y="320" fill="#e8ebf5" font-family="Inter, sans-serif" font-size="26" font-weight="700">AI Setup Assistant</text>
  <text x="40" y="344" fill="#8a93b0" font-family="Inter, sans-serif" font-size="14">FastAPI · Gemini · streaming SSE</text>
</svg>
